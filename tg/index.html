age":"https://www.hse.ru/org/persons/218356175"},{"name":"Лескина Элеонора Игоревна","about":"Доцент департамента права цифровых технологий и биоправа НИУ ВШЭ, кандидат юридических наук","photo":"../images/teachers/leskina-eleonora-igorevna.jpg","page":"https://www.hse.ru/org/persons/959491681/"},{"name":"Ошманкевич Ксения Романовна","about":"Доцент департамента права цифровых технологий и биоправа НИУ ВШЭ, кандидат юридических наук","photo":"../images/teachers/oshmankevich-kseniya-romanovna.jpg","page":"https://www.hse.ru/org/persons/959493430/"},{"name":"Кривушева Ситора Сергеевна","about":"Доцент департамент права цифровых технологий и биоправа, кандидат юридических наук","photo":"../images/teachers/krivusheva-sitora-sergeevna.jpg","page":"https://www.hse.ru/org/persons/885876923/"}],"feedback":[{"text":"Курс «Цифровое право для бизнеса» оказался очень полезным и содержательным. Программа охватывает ключевые вопросы регулирования цифровой экономики: интернет-пространство, цифровые платформы, искусственный интеллект, большие данные, персональные данные и кибербезопасность. Особенно ценно, что многие темы рассматривались не только с теоретической, но и с практической точки зрения - через реальные кейсы и примеры из правоприменительной практики. Для меня как для юриста главным результатом курса стало более системное понимание того, как классические правовые инструменты применяются в цифровой среде и как выстраивать юридическое сопровождение цифровых продуктов и сервисов. Отдельно хотелось бы отметить высокий уровень преподавателей и структурированную подачу материала. Курс позволяет расширить профессиональный кругозор и лучше понять современные вызовы, с которыми сталкивается право в условиях цифровизации бизнеса. Рекомендую его юристам, которые хотят развиваться в направлении цифрового права и правового сопровождения технологических компаний.","author":"Владислав, главный специалист банка"},{"text":"Курс «Цифровое право для бизнеса» оставил у меня в целом очень положительное впечатление. Он был не просто теоретическим, а очень полезным с практической точки зрения. Особенно понравилось, что курс охватывает актуальные и значимые для бизнеса темы в сфере цифрового права. Предоставленный материал мне помог лучше понять, как право работает в условиях цифровой экономики, какие требования предъявляются к компаниям в сфере персональных данных, электронной коммерции, интеллектуальной собственности, цифровых платформ и онлайн-коммуникаций. Многие вопросы, которые раньше мне казались сложными или абстрактными, после прохождения курса стали гораздо понятнее и структурированнее. Спасибо за отличных спикеров!","author":"Полина, специалист по интеллектуальной собственности"},{"text":"Курс помог мне удостовериться в правильности выбранного мною карьерного пути айти-юриста (сфера интересная, актуальная, стратегически важная и суперперспективная для развития), удостовериться в актуальности имеющихся знаний и расширить горизонты дальнейшего познания (например, начал смотреть в область информабезопасности и искусственного интеллекта). Самое для меня важное: я обрел ролевую модель того опыта, который хотел бы получить. За что отдельное спасибо Авакян Е.Г. Её лекции показались мне самыми интересными и отзывающимися. Её уникальное сочетание скиллов в лигалтехе и законотворчестве в довесок к структурной, живой и доступной манере подачи материала заставили меня несколько раз переслушать её лекции","author":"Максим, юрист"},{"text":"Огромная благодарность лекторам за открытость, желание делиться опытом, дать развернутые ответы на все возникающие вопросы. Содержание лекций максимально полезно по содержанию, структурно, без воды и лишней информации. И, безусловно, разбор кейсов - это вишенка на торте лично для меня. Благодарю!","author":"Анна, юрист"},{"text":"Курс был по совершенно новой для меня теме. Огромное спасибо всему преподавательскому составу и куратору курса за быстрые и своевременные ответы на все появлявшиеся по ходу обучения вопросы. Курс теоретически объемный, но и практические задачи позволяют применить теорию. Узнал много новой информации, в последующем планирую пополнять собственные знания в данной сфере.","author":"Денис, юрисконсульт"},{"text":"Курс очень понравился! Было интересно, преподаватели отвечали на интересующие вопросы, делились практическими советами. Темы курса очень актуальны в настоящее время. Сама платформа удобна в использовании. Куратор курса также был на связи и отвечал на интересующие вопросы. Спасибо!","author":"Ольга, младший юрист"},{"text":"Курс очень фундаментален, с учётом того, что цифровое право в настоящий момент ещё формируется, многое в его регулировании является эксперементальным не только в нашей, но и зарубежной правовой системе. В лекциях упор был сделан на практическое применение норм, что очень важно для человека, уже работающего в юридической сфере. Очень порадовало, что были приведены примеры из реальной судебной практики.","author":"Екатерина, начальник юридического отдела"},{"text":"Все отлично отлажено, интересная подача, очень хороший и новый материал, не пожалел ни разу, что записался на этот курс!","author":"Максим, юрист"},{"text":"Курс очень понравился. Опытные преподаватели с очень интересной подачей материала, различные кейсы. Особенно понравились тесты - позволяют проверить насколько усвоен материал. Получила ценные и необходимые знания.","author":"Анастасия, юрист"}],"admissionDocs":["Паспорт (страницы 2, 3, и с текущей регистрацией по месту жительства)","Диплом об образовании: высшем или среднем профессиональном (для студентов – справка из вуза)","СНИЛС (номер пенсионного страхования)"],"faq":[]},{"id":"814248062","title":"Исламские финансы: правовые основы, комплаенс и бизнес-практика","sphere":"finance","badge":"ПК","doc":"Удостоверение о повышении квалификации НИУ ВШЭ","format":"Онлайн синхронный","duration":"3 месяца","hours":"136 часов","startLabel":"Старт: 28 сентября 2026 г.","price":78000,"oldPrice":null,"tagline":"Курс по исламскому ба ния и заключения контрактов с деловыми партнерами, маркетинг в исламском праве и тенденции развития исламских компаний.","lead":"Курс по исламскому банкингу для экономистов, руководителей бизнеса и сотрудников международных компаний. За 10 недель учебы в НИУ ВШЭ вы разберетесь в исламских финансах и банкинге.","aboutItems":null,"audienceIntro":"Данный курс по исламскому банкингу предназначен для слушателей, интересующихся тематикой исламских финансов для профессиональных или личных целей.","advantages":["Практические занятия по изучаемым темам, разбор кейсов, дискуссии, работа с реальными договорами","Возможность получить консультации от высококвалифицированных специалистов и найти партнеров для своих бизнес-проектов","Анализ бизнес-проекта на практическом занятии на предмет как экономической успешности, так и соответствия нормам ислама"],"language":"русский","schedule":null,"priceTerms":[],"notice":null,"files":[{"title":"Учебный план","size":"99,2 Кб","path":"../files/814248062-plan.pdf"}],"teachers":[{"name":"Калимуллина Мадина Эмировна","about":"Старший научный сотрудник института права и развития ВШЭ – Сколково факультета права НИУ ВШЭ","photo":"../images/teachers/kalimullina-madina-emirovna.jpg","page":"https://www.hse.ru/org/persons/227892037/"}],"feedback":[{"text":"Качественный, полноценный курс для начала знакомства с темой исламские финансы, дает полное понимание устройства новых финансовых инструментов, актуальный опыт и проблематика над которой можно работать и развивать. Интересные экспертные сессии так же помогли оценить идеи с учетом реалий рынка.","author":"Мишарина Мария"},{"text":"Благодарность организаторам за систематизацию информации в курс. Удобный формат и график обучения. Высокая вовлеченность преподавателя в коммуникации со слушателями: оперативная поддержка знаниями, информирование о мероприятиях по целевой тематике и развернутая обратная связь по возникающим вопросам от слушателей. Предметность. Практичность. Актуальность. Желаю успехов в развитии образовательного продукта на рынке.","author":"Ирина Уланова"},{"text":"Несколько лет искала возможность пройти обучение по теме исламских финансов, надеялась на лекции или семинары. Но когда увидела полноценный курс от Мадины Калимуллиной то была просто в восторге. Давно наблюдаю за работой Мадины и восхищена её работами. Отдельно порадовало то, что курс проходит на базе одного из самых знаменитых вузов страны в сфере экономики. Спасибо за эту возможность. Уже всем знакомым порекомендовала это обучение!","author":"Тамила Яндиева"},{"text":"Удивлен высоким уровнем курса и требовательностью к его освоению. До начала занятий считал, что разбираюсь в теме. После окончания понимаю, что многое узнал и еще многое предстоит узнать. Спасибо Вам, Мадина, и всем кто с Вами организовывал наши занятия.","author":"Аслан"},{"text":"Все очень понравилось, я очень далека от экономики, курс дался нелегко, но подача материала и преподаватель просто на высоком уровне!","author":"Аиша"},{"text":"Превосходный, востребованный курс! Ценность курса его практическая ориентация! Пришла на курс с нулевыми знаниями и оочень обогатилась в этом плане! Преподаватель умеет донести информацию до слушателей: все предельно доступно и понятно! Осталась довольна проведенным временем и полученными знаниями!","author":"Эльвира Ирековна Абдуллина"},{"text":"Огромная благодарность ВШЭ за доступный курс и преподавателю Мадине Эмировне за профессиональный, комплексный подход к образовательному процессу. Информация, раскрывающая суть, представлена ёмко, много практических кейсов, интересных заданий. Воспользуюсь предоставленным доступом к курсу для закрепления материала. Спасибо за знания и организацию обучения!","author":"Лилия Р."}],"admissionDocs":["Паспорт (страницы 2, 3, и с текущей регистрацией по месту жительства)","Диплом об образовании: высшем или среднем профессиональном (для студентов – справка из вуза)","СНИЛС (номер пенсионного страхования)"],"faq":[]},{"id":"474776084","title":"Право н р, тренер медиаторов, куратор образовательных программ по бизнес-медиации","photo":"../images/teachers/svetlana-kirienko.jpg","page":null}],"feedback":[{"text":"Программа помогла многое переосмыслить и получить практические коммуникационные навыки. Очень понравилась практическая ориентированность программы, а ещё интересные лекции и очные тренинги и теплая атмосфера, состояние живого интереса, которое передавали тренеры. Большая благодарность.","author":"Лысенко Мария Николаевна, юрист"},{"text":"Программа очень насыщенная, преподавательский состав впечатляет! Мы окунулись в процесс практически сразу, проводя учебные медиации под руководством кураторов и преподавателей. За счет такого количества материала, который иногда кажется неподъемным, приходит то самое качество, где ты незаметно, но преображаешься. И превращаешься в медиатора.. Спасибо!!!","author":"Алиева Севиль Алиевна. Психолог, преподаватель, частный практик, эксперт РАНХиГС"},{"text":"Программа очень ёмкая. Интересная и абсолютно понятная. Воспринимается с лёгкостью. Качественно преподносится материал. Преподавательский состав очень сильный.","author":"Федорова Анна Сергеевна – управляющий сети обособленных подразделений коммерческого управления, компания ООО «ЭкоСтройРесурс»"},{"text":"После прохождения программы профессиональной переподготовки «Бизнес-медиация» наступает профессиональная и личностная трансформация, которая открывает все двери коммуникации и дает новое понимание и восприятия конфликта как подарка. Педагоги со всей душой на каждой лекции делятся своими знаниями и опытом, создавая здоровую вдохновляющую атмосферу, в которой хочется учиться и развиваться. Отдельно также хочу отметить участников программы, это люди с богатым профессиональным опытом и с запросом учиться и получать новые компетенции и soft skills.","author":"Гошко Юлия Викторовна"},{"text":"Очень грамотно построен учебный процесс. Практическая отработка на очных тренингах полученной на лекциях инфромации, делает обучение интересным и эффективным. Прекрасные преподаватели-практики! Курс помогает совершенствовать коммуникативные навыки, трансформирует мышление. Полезен, в том числе, и для людей с большим опытом в бизнесе. Спасибо!","author":"Мурыгина Ольга Андреевна исполнительный директор сфера - управление коммерческой недвижимостью, инв.девелопмент"},{"text":"Обучение мне очень понравилось, особенно наполнение самой программы, что есть темы, которые прокачивают меня саму в том числе. Преподаватели все очень сильные, качественно передают материал, точно отвечают на вопросы, без воды. Интересуются обратной связью - это тоже важно. Очные тренинги неотъемлемая часть обучения, круто, что они есть. Понравились группы открытого диалога. Куратор Светлана - всегда на связи, оперативно помогает в решении вопросов. Благодарю все преподавателей, кураторов и моих сокурсников ❤️ новые знакомства – это прекрасно.","author":"Аникина Юлия Сергеевна, главный специалист, Росбанк"},{"text":"Огромная благодарность преподавательскому составу за ту атмосферу, которую создали для студентов. Уюта, комфорта и возможности быть собой. Спасибо за открытые и исчерпывающие ответы на множества уточняющих вопросов. За уровень профессионализма и за демонстрацию любви к своей профессии:)","author":"Лебедева Ирина Александровна"},{"text":"Я очень довольна обучением. Преподавательский состав, сам материал, практика, удобна платформа для обучения, забота о студентах всё на высшем уровне.","author":"Шлеева Ксения Георгиевна"},{"text":"Программа имеет структуру. Опирается на практическую деятельность. Полезна для тех, кто хочет посмотреть на себя с другой стороны. Помогает в этом. Если только будете действительно слушать преподавателей и прислушиваться к себе самому.","author":"Бахарев Алексей Сергеевич, руководитель строительной компании"},{"text":"Эта программа для тех, кто хочет расширить свое мировоззрение, прокачать soft-skills и открыть для себя новую сферу деятельности, в которой много возможностей для творчества и роста.","author":"Лилия Троицкая"},{"text":"Шикарная программа! Слаженная работа преподавательского состава,интересные лекции и особенно очные занятия!","author":"Василенко Петр Юрьевич. Индивидуальный предприниматель"}],"admissionDocs":["Паспорт (страницы 2, 3, и с текущей регистрацией по месту жительства)","Диплом об образовании: высшем или среднем профессиональном (для студентов – справка из вуза)","СНИЛС (номер пенсионного страхования)"],"faq":[{"q":"С какой целью вы изначально шли на эту программу?","a":"Расширить границы своих возможностей и получить новый импульс развития Получить новую специальность: медиатора (и документы об этом) Прокачать софт-скиллы, навыки переговоров и конструктивного разрешения конфликтов Перезагрузиться: сменить круг общения и перейти на другой жизненный уровень Изменить паттерн собственного поведения, структурировать работу над собой, полюбить людей Научиться договариваться Сделать медиацию своим бизнесом Использовать результаты в работе и в личной жизни"},{"q":"Что оказалось самым ценным на этой программе?","a":"Упражнения: про проекции, стереотипы, «балансировку на ноль», разбор кейсов с анализом разных взглядов и позиций Умение полюбить конфликт Открывшийся дивный новый мир Практика переговоров и открытые вопросы"},{"q":"Какие результаты вы забираете с собой после обучения?","a":"«Чемоданчик» с медиативными техниками Иное мышление в разрешении споров Понимание, что одной правды не бывает, все люди разносторонние, и, пожалуй, даже хорошие:) Умение слушать, понимать и принимать Саморазвитие: новое направление и трек карьеры юриста (переговорщика и медиатора) Изменение рамки восприятия Навыки эффективных коммуникаций и расширение границ взаимодействия Слушать и слышать важнее, чем говорить Новые интересные знакомства"},{"q":"Как звучала бы ваша рекомендация нашей программы?","a":"Если хочешь научиться решать любые конфликты мирным путём, то надо идти на этот курс! Получаемые на программе навыки и знания полезны в самых разных сферах жизни Она как полезна для карьеры медиатора, так даёт и большой набор софт скиллз для применения в текущей юридической практике (как в инхаус, так и в консалтинге) Это даже не про профессию, а про умение договориться в жизни и стать лучшей версией себя Если хочешь стать эффективным в решении казалось бы неразрешаемых конфликтов, перейти на космический уровень в переговорах, стать востребованным за рамками своей специализации, или просто удивить коллег – тебе сюда Программа, расширяющая границы переговоров до бесконечных просторов Это лучшее мое вложение за последние пять лет. Я уже всем рекомендую!"},{"q":"Почему вы выбрали именно медиация обучение, а не классическое юридическое направление?","a":"Я искал не просто теорию права, а прикладные инструменты работы с конфликтами в бизнесе. Обучение медиации дало мне понимание процессов переговоров, управления интересами сторон и профилактики судебных споров. Это не альтернатива юриспруденции, а её усиление."},{"q":"Был ли в программе элемент обучения по медиации в формате практик?","a":"Да, и это был ключевой блок. Обучение по медиации проходило через разбор конфликтов, ролевые игры. Мы не просто слушали лекции, а отрабатывали инструменты переговоров в моделируемых бизнес-ситуациях."},{"q":"Какую роль сыграло обучение управление конфликтом в вашей профессиональной работе?","a":"Именно обучение управление конфликтом стало для меня поворотным моментом. Я научился видеть структуру спора, отделять позиции от интересов и снижать эмоциональное напряжение сторон. Это повысило эффективность переговоров и уменьшило количество эскалаций."}]},{"id":"1129129056","title":"Безопасное внедрение цифровых инструментов в кадровую работу: юридические требования","sphere":"digital","badge":"ПК","doc":"Удостоверение о повышении квалификации НИУ ВШЭ","format":"Очный","duration":null,"hours":"34 часа","startLabel":"Старт: 24 октября 2026 г.","price":40000,"oldPrice":null,"tagline":"Научим эффективно внедрять цифровые инструменты в HR-процессы", ale. Le cours sera dispensé en ligne par un avocat français renommé possédant une vaste expérience pratique et enseignant à l'Université Jean Moulin de Lyon III (France), à l'Université nationale de recherche l'École supérieure d'économie et dans d'autres universités de Moscou - Alain Duflot. Un magistrat de l’OHADA (Organisation pour l’Harmonisation en Afrique du Droit des Affaires) prendra également part à la mise en œuvre du programme. À la suite de la réussite du cours, les étudiants: seront en mesure de mieux comprendre différents types de textes juridiques; apprendre à comprendre les institutions et les termes fondamentaux du système juridique romain; maîtriser la logique et l'argumentation juridique. Le programme intéressera les étudiants qui envisagent de poursuivre leurs études dans des universités francophones; spécialistes dans le domaine du droit international et du commerce en interaction avec des partenaires francophones; traducteurs utilisant la terminologie juridique.","audience":["Студентов, которые хотят изучать или уже изучают право на французском языке или рассматривают возможность обучения во франкофонном университете","Практикующие специалисты в области международного права и торговли","Переводчики, которые хотят познакомиться с системой права и улучшить свое владение юридическим языком"],"results":["Лучше понимать различные типы юридических текстов Mieux comprendre les différents types de textes juridiques","Изучить основные институты, категории и термины романской системы права, научиться применять их в своей практической деятельности Étudier les principales institutions, catégories et termes du système juridique romain, apprendre à les appliquer dans leurs activités pratiques","Овладеть логикой и юридической аргументацией Mieux maîtriser la logique et l’argumentation juridique"],"modules":[{"title":"Глава 1. Правовые основы в системе романского права / Chapitre 1. Le cadre du droit dans le système de droit romain","hours":"","topics":["Основные разделы права / Les grandes divisions du droit","Выражение неопределенности в законе / L’expression de l’indéfini en droit","Источники права / Les sources du droit","Юридический силлогизм и квалификация в праве / Le syllogisme juridique et la qualification en droit","Грамматика выражения возражения и уступки / Grammaire l’expression de l’opposition et de la concession"]},{"title":"Глава 2. Пример франкоязычного права: OHADA (Организация по гармонизации коммерческого права в Африке) / Un exemple de droit francophone: L’OHADA (Organisation pour l’Harmonisation en Afrique du Droit des Affaires)","hours":"","topics":["Проект (индивидуальная работа) / Le projet (travail personnel)","Общий суд правосудия и арбитража (CCJA) / La Cour Commune de Justice et d’Arbitrage (CCJA)","Процессуальный словарь / Vocabulaire de la procédure"]},{"title":"Глава 3. Обязательства / Chapitre 3 Les obligations","hours":"","topics":["Договор как основополагающее понятие в праве / Le contrat une notion fondamentale en droit","Аспекты договорного права / Aspects du droit des contrats"]},{"title":"Глава 4. Юридическое письмо и письмо в суд: цели и методы / Chapitre 4. L’écrit juridique et judiciaire: Objectifs et méthodes","hours":"","topics":["Задания: применение на практике методов аргументации (составление аргументов) / Activités: mise en pratique des techniques de l’argumentation (rédaction d’argumentaires)","Специфика юридического и судебного письма / La spécificité de l’écrit juridique et judiciaire","Методы аргументации / Les techniques de l’argumentation","Стиль юридического и судебного письма: писать, чтобы быть прочитанным / Le style de l’écrit juridique et judiciaire: Ecrire pour être lu"]}],"cover":"../images/programs/1057557281.jpg","thumb":"../images/programs/thumbs/1057557281.jpg","pay":"https://lk.hse.ru/signin?redirecturl=https%3A%2F%2Fwww.hse.ru%2Fmirror%2Fco-auth%2Felk%2Fgateway.html%3Fext%3Dmarketplace%26i%3D*aHR0cHM6Ly93d3cuaHNlLnJ1L2VkdS9kcG8vMTA1NzU1NzI4MT9hY3Rpb249Y2F юбой компании, работающей на международном рынке, а в частности с Китаем невозможен без знания законов этой страны. Понимание принципов правовой системы поможет не только максимизировать прибыль, но и избежать рисков в торговой и инвестиционной деятельности. Изучив законодательные нормы, вы сможете стать уникальным ценным специалистом, а ваша компания сможете получить колоссальное конкурентное преимущество. На курсе вы: изучите структуру и ключевые отрасли китайского права; научитесь анализировать правовые ситуации с учетом норм КНР, международного и российского законодательства; освоите практические навыки применения китайских нормативных актов; научитесь оценивать правомерность действий и разработке юридических стратегий для бизнеса. Программа также позволит вам прогнозировать правовые риски и разрабатывать рекомендации по работе в китайской правовой среде. 3 ключевых преимущества программы: Прикладные знания и навыки от практикующих юристов Китая и России Реальные кейсы + моделирование учебных ситуаций Новые профессиональные возможности для работы с Китаем","lead":"Вы получите базовые знания о правовой системе Китая необходимые для международной коммерческой деятельности","aboutItems":null,"audienceIntro":null,"advantages":["Прикладные знания и навыки от практикующих юристов Китая","Реальные кейсы + моделирование учебных ситуаций","Новые профессиональные возможности для работы с Китаем"],"language":"русский","schedule":null,"priceTerms":["16 250 рублей можно вернуть налоговым вычетом","Скидки 5-10% студентам, слушателям и выпускникам основных и дополнительных программ НИУ ВШЭ","Скидки для юридических лиц при направлении на обучение 3 и более сотрудников от одной организации"],"notice":null,"files":[{"title":"Учебный план","size":"89,6 Кб","path":"../files/894108285-plan.pdf"}],"teachers":[{"name":"Гэн Баоцзянь","about":"Адвокат. Президент Синьцзянской ассоциации адвокатов, директор генерального офиса и старший партнер Синьцзянской юридической фирмы «Yuanzheng Shengye», член КПК, независимый аналитик Шанхайской фондовой биржи.","photo":"../images/teachers/gen-baotszyan.jpg","page":null},{"name":"Лю Вэньцинь","about":"Адвокат. Директор комитета по управлению и партнер Синьцзянской юридической фирмы «Yuanzheng Shengye», член КПК, независимый аналитик Шанхайской фондовой биржи, эксперт Западной группы лекторов Всекитайской ассоциации юристов.","photo":"../images/teachers/lyu-ventsin.jpg","page":null},{"name":"Хэ Цзяхуэй","about":"Юрист. Специализация на таких областях бизнеса, как строительство и недвижимость, имеет квалификацию независимого директора листинговой компании.","photo":"../images/teachers/he-tszyahuey.jpg","page":null},{"name":"Чжан Вэньцзюнь","about":"Юрист. Партнер профессионального комитета по корпоративным юридическим вопросам Синьцзянской юридической фирмы «Yuanzheng Shengye». Специализируется на корпоративных юридических делах, гражданских и коммерческих судебных процессах.","photo":"../images/teachers/chzhan-ventszyun.jpg","page":null},{"name":"Хань Сяомэй","about":"Адвокат. Член профессионального комитета по корпоративному праву, член представительства Хайкоу Ассоциации адвокатов «Один пояс и один путь», член Революционного комитета Гоминьдана. Шанхайский педагогический университет.","photo":"../images/teachers/han-syaomey.jpg","page":null},{"name":"Ван Лисюань","about":"Адвокат юридической фирмы «Hainan Zhongbang», член группы юридических услуг Китайской международной ярмарки потребительских товаров 2022 года.","photo":"../images/teachers/van-lisyuan.jpg","page":null},{"name":"Луан Цзина","about":"Юрист. Специализация: международная торговля, международные инвестиции и финансирование, частные акционерные фонды, коммерческие споры и международный арбитраж. Заместитель директора и практикующий юрист юридической фирмы «Taihua Shangheng»","photo":"../images/teachers/luan-tszina.jpg","page":null},{"name":"Чжан Цин","about":"Исполнительный директор юридической фирмы «Taihua Shangheng (Qingdao)». Имеет многолетний опыт работы в области гражданского, коммерческого и экономического права, связанного с иностранцами, и юристов по слияниям и поглощениям предприятий. MBA. Университет штата Миссури, США.","photo":"../images/teachers/chzhan-tsin.jpg","page":null},{"name":"Мэн Эньхая","about":"Адвокат. Старший партнер юридической фирмы «Юнцзясинь». Директор Ассоциации по изучению гражданского и коммерческого права Юридического общества провинции Шэньси. Заместитель директора Профессионального комитета по корпоративному праву Ассоциации адвокатов провинции Шэньси.","photo":"../images/teachers/men-enhaya.jpg","page":null},{"name":"Цзи Цзэвэй","about":"Адвокат. Специализация: юридическое управление человеческими ресурсами, разрешение коммерческих споров, управление юридическими рисками предприятия и построение системы соответствия. Заместитель секретаря партийного комитета и старший партнер юридической фирмы «Shaanxi yongjiaxin»","photo":"../images/teachers/tszi-tszevey.jpg","page":null},{"name":"Чжао Гэхуэй","about":"Адвокат. Партнер юридической фирмы «Shaanxi Yongjiaxin», дипломированный налоговый бухгалтер, директор Ассоциации исследований права недвижимости Юридического общества провинции Шэньси, член профессионального комитета по налоговому и налоговому праву Ассоциации адвокатов провинции Шэньси, научный сотрудник Института арбитража Сианьской арбитражной комиссии.","photo":"../images/teachers/chzhao-gehuey.jpg","page":null},{"name":"Конюшкевич Вадим Дмитриевич","about":"Управляющий партнер и юрист «VK Partners», Адвокат","photo":"../images/teachers/konyushkevich-vadim-dmitrievich.jpg","page":null},{"name":"Базурин Глеб Владимирович","about":"Генеральный директор «VK Partners», арбитр Российского арбитражного центра","photo":"../images/teachers/bazurin-gleb-vladimirovich.jpg","page":null},{"name":"Старжинская Екатерина Александровна","about":"Главный юрисконсульт ПАО «Новолипецкий металлургический комбинат»","photo":"../images/teachers/starzhinskaya-ekaterina-aleksandrovna.jpg","page":null},{"name":"Лысов Сергей Владимирович","about":"Адвокат, старший юрист КА «Монастырский, Зюба, Степанов и партнеры»","photo":"../images/teachers/lysov-sergey-vladimirovich.jpg","page":null},{"name":"Уханова Ксения Александровна","about":"Юрист ООО «ВК», сопровождение соцсетей и социальных проектов","photo":"../images/teachers/uhanova-kseniya-aleksandrovna.jpg","page":null},{"name":"Максимов Дмитрий Михайлович","about":"Старший преподаватель Департамент правового регулирования бизнеса НИУ ВШЭ","photo":"../images/teachers/maksimov-dmitriy-mihaylovich.jpg","page":"https://www.hse.ru/staff/maksimov/"},{"name":"Иманалиева Мария Алмазовна","about":"Младший научный сотрудник Института исследований национального и сравнительного права факультета права НИУ ВШЭ","photo":"../images/teachers/imanalieva-mariya-almazovna.jpg","page":"https://www.hse.ru/org/persons/510319535/"}],"feedback":[{"text":"Прохождение данного курса было связано с личным интересом к теме и видами на карьерный рост. Курс помог разобраться в работе китайской правовой системы, указав на то, чему стоит уделять внимание, а где есть риски и подводные камни. Он прекрасно подходит для тех, кто хочет получить базовую информацию и основные опорные точки, от которых можно будет отталкиваться в дальнейшем саморазвитии.","author":"Вероника"},{"text":"Курс «Введение в правовую систему Китая» в ВШЭ стал для меня ключом к пониманию логики современного Китая. Вместо скучного перечисления законов я получил анализ системы. Преподаватели с практическим опытом. Особая благодарность Екатерине Стражинской. Курс требует вовлеченности. Он необходим всем, кто работает с Азией, в международных корпорациях или на госслужбе. Это один из самых полезных курсов: он не просто дает знания, а меняет взгляд и позволяет читать новости о Китае на другом уровне.","author":"Роман"},{"text":"В моем случае, максимально востребованная информация. Поскольку у меня имеется опыт работы с Китаем и определенные знания уже есть, курс дал возможность систематизировать знания и опыт, заполнить существенное количество пробелов.","author":"Юрий"},{"text":"Курс китайского права нужен мне для работы. Я не ожидала, что материалы столь обширно будут покрывать отрасли права, поэтому была удивлена дополнительной информацией, которую получила бонусом. Приятно получать знания от практикующих юристов, адвокатов, лекторов. Кроме того, в ходе обсуждений и общения в мессенджере получили дополнительные материалы для чтения. Больше всего понравилось введение, где проходили культурные особенности, основы гражданского права, ВЭД. Огромное спасибо за подход, профессионализм и структурированность!","author":"Анастасия"},{"text":"Очень хорошо структурированный и полезный курс. Обеспечивает многогранное понимание основ китайского права и, вместе с тем, дает ответы на конкретные практические вопросы, возникающие в процессе работы. Очень понравилась возможность проведения дискуссий с российскими и китайскими коллегами.","author":"Владимир"},{"text":"Отличный курс, чтобы начать знакомство с профильными сферами и законами КНР. С учетом запросов от бизнеса очень полезный курс, чтобы можно было разобраться с основой и иметь представление как общаться с консультантами и каких результатов ожидать.","author":"Ольга"},{"text":"Курс был для меня интересен и полезен, отдельные лекции пересматривала несколько раз, так как хотелось уловить все и ничего не забыть. Много практических рекомендаций по работе с китайскими контрагентами в различных сферах предпринимательской деятельности и реальными кейсами.","author":"Мария"},{"text":"В целом, курс оставил приятные впечатления, учитывая, что для меня тема не новая. Но некоторые моменты стали более понятными. Обмен опытом - тоже полезная опция. Творческие занятия позволяют более подробно проработать тот или иной вопрос.","author":"Иван"}],"admissionDocs":["Паспорт (страницы 2, 3, и с текущей регистрацией по месту жительства)","Диплом об образовании: высшем или среднем профессиональном (для студентов – справка из вуза)","СНИЛС (номер пенсионного страхования)"],"faq":[{"q":"В каком формате организованы занятия?","a":"После зачисления на программу слушателям предоставляется доступ к электронному учебному курсу на платформе iSpring. Все материалы, записи занятий, а также ссылки на подключение к вебинарам открываются на платформе поэтапно, согласно расписанию. Онлайн занятия проходят в синхронном на платформе MTS Link/Voovmeeting. Записи и презентации онлайн занятий выгружаются на платформу на следующий рабочий день после проведённого занятия. Во время обучения слушатели знакомяться с лекциями китайских экспертов. Все лекции переведены на русский язык, снабжены презентационными и текстовыми материалами. После изучения лекций при поддержке российских экспертов-практиков проводятся семинарские занятия в формате онлайн: слушатели рассмотривают реальные кейсы взаимодействия с китайскими партнерами. Во время проведения дискуссионных занятий слушатели совместно с российскими и китайскими экспертами обсуждают основы правовой системы Китая, плюсы и минусы применения норм международного, российского или китайского права в различных ситуациях. Завершает процесс обучения – итоговая аттестация в форме тестирования."},{"q":"На какое время предоставляется доступ к материалам?","a":"Доступ к материалам курса предоставляется слушателям на время обучения на программе, а также сохраняется в течение 2 месяцев после ее завершения."},{"q":"Как я смогу получить справку для возврата налогового вычета?","a":"Для получения справки для возврата налогового вычета: Скачайте и заполните в печатном виде шаблон заявления; Отправьте готовый документ на электронную почту fd@hse.ru; В теме письма укажите: «Справка об оплате образовательных услуг для налоговой». Срок предоставления справки: до 10 рабочих дней. По факту готовности справки вам придет уведомление на e-mail. Справку можно получить: Финансовая приемная на Мясницкой (ул. Мясницкая, д. 20, переход в здание по Кривоколенному пер., 3а, 4-й
