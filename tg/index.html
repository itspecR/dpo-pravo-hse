Э и других московских вузах - Алан Дюфло. В реализации программы примет участие также судья ОХАДА (Организации по гармонизации коммерческого права в Африке). В результате успешного прохождения курса слушатели: смогут лучше понимать различные типы юридических текстов; научатся разбираться в основных институтах и терминах романской системы права; овладеют логикой и юридической аргументацией. Программа будет интересна студентам, которые планируют продолжить обучение во франкофонных университетах; специалистам в сфере международного права и торговли, взаимодействующих с франкоязычными партнерами; переводчикам, использующим юридическую терминологию. Le cours de formation professionnelle supplémentaire «Droit, Terminologie, Argumentation» (en français) est un produit éducatif unique qui n’a pas d’analogues dans la pratique éducative mondiale. Le cours sera dispensé en ligne par un avocat français renommé possédant une vaste expérience pratique et enseignant à l'Université Jean Moulin de Lyon III (France), à l'Université nationale de recherche l'École supérieure d'économie et dans d'autres universités de Moscou - Alain Duflot. Un magistrat de l’OHADA (Organisation pour l’Harmonisation en Afrique du Droit des Affaires) prendra également part à la mise en œuvre du programme. À la suite de la réussite du cours, les étudiants: seront en mesure de mieux comprendre différents types de textes juridiques; apprendre à comprendre les institutions et les termes fondamentaux du système juridique romain; maîtriser la logique et l'argumentation juridique. Le programme intéressera les étudiants qui envisagent de poursuivre leurs études dans des universités francophones; spécialistes dans le domaine du droit international et du commerce en interaction avec des partenaires francophones; traducteurs utilisant la terminologie juridique.","audience":["Студентов, которые хотят изучать или уже изучают право на французском языке или рассматривают возможность обучения во франкофонном университете
